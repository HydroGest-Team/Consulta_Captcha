services:
  consulta-service:
    build: ./consulta-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mariadb://host.docker.internal:3306/hydrogest
      DB_USER: hydro_ro
      DB_PASSWORD: ${HYDRO_RO_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web-publica:
    build:
      context: ./web-publica
      args:
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
    ports:
      - "3000:3000"
    environment:
      CONSULTA_SERVICE_URL: http://consulta-service:8081
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
    depends_on:
      - consulta-service