openapi: 3.0.3
info:
  title: HydroGest Consulta Publica API
  version: 1.0.0
  description: Consulta publica (solo lectura) del estado de cuenta por codigo de contador
servers:
  - url: http://localhost:8081
tags:
  - name: consulta
    description: Endpoints de consulta publica
paths:
  /api/v1/consulta/{codigoContador}:
    get:
      tags:
        - consulta
      summary: Consultar estado de cuenta de un contador
      operationId: consultarEstadoCuenta
      parameters:
        - name: codigoContador
          in: path
          required: true
          description: Codigo del contador (ej. CTR-001)
          schema:
            type: string
            pattern: '^[A-Z0-9_-]{1,20}$'
            maxLength: 20
      responses:
        '200':
          description: Consulta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoCuenta'
        '400':
          description: Codigo con formato invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Contador no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '429':
          description: Limite de peticiones por IP excedido
          headers:
            Retry-After:
              description: Segundos para que se reinicie la ventana
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
components:
  schemas:
    EstadoCuenta:
      type: object
      properties:
        codigoContador:
          type: string
        titular:
          type: string
          description: Nombre enmascarado (primer nombre + inicial del primer apellido + ***)
        estado:
          type: string
          enum:
            - AL_DIA
            - PENDIENTE
        saldoPendiente:
          type: number
          description: Suma de los montos de lecturas sin pago, en quetzales
        ultimaLectura:
          $ref: '#/components/schemas/UltimaLectura'
        ultimosPagos:
          type: array
          description: Ultimos 5 pagos, del mas reciente al mas antiguo
          items:
            $ref: '#/components/schemas/PagoResumen'
    UltimaLectura:
      type: object
      properties:
        fecha:
          type: string
          format: date
        lectura:
          type: number
        consumoM3:
          type: number
    PagoResumen:
      type: object
      properties:
        fecha:
          type: string
          format: date
        monto:
          type: number
    ErrorRespuesta:
      type: object
      properties:
        mensaje:
          type: string